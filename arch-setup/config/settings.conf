# settings.conf — Valores por defecto de arch-setup (sintaxis bash).
#
# La primera vez que ejecutas install.sh, el módulo "settings" te pregunta
# estos datos (proponiendo lo de aquí) y guarda tus respuestas en
# config/settings.local.conf, que se carga después y tiene prioridad.
# Para volver a preguntar: borra settings.local.conf o responde "no" al resumen.

# --- Particiones (las creas tú antes con cfdisk; se formatean las dos) ------
ESP_PART=""             # FAT32, se monta en /efi   (p. ej. /dev/nvme1n1p1)
ROOT_PART=""            # ext4, se monta en /        (p. ej. /dev/nvme1n1p2)

# --- Sistema ----------------------------------------------------------------
SYS_USER="br4ndol"
SYS_HOSTNAME="arx-br4ndol"
TIMEZONE="America/Santo_Domingo"   # UTC-4
LOCALE="en_US.UTF-8"
KEYMAP="us"
PASSWORD_HASH=""        # hash SHA-512 de la contraseña (usuario y root); lo
                        # rellena el módulo settings. Nunca la contraseña en texto.

# --- Kernel y hardware ------------------------------------------------------
KERNEL="linux-cachyos-bore"
CPU="intel"             # intel | amd  (define el paquete de microcódigo)
GPU=""                  # nvidia-hybrid | intel | none. Vacío = se detecta y se
                        # pregunta (en una máquina virtual propone "none")

# --- Escritorio -------------------------------------------------------------
DESKTOP="gnome"         # gnome (más en el futuro: modules/post/desktop/<nombre>.sh)

# --- Paquetes ---------------------------------------------------------------
AUR_HELPER="yay"
FLATPAK_REMOTE="flathub"
